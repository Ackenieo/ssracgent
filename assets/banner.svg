<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">dsh-superagent</title>
  <desc id="bannerDesc">A proactive coding agent for one GitHub repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#131F3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <ellipse cx="1005" cy="150" rx="205" ry="150" fill="url(#glow)"/>

  <rect x="64" y="92" width="6" height="156" rx="3" fill="url(#accent)"/>

  <text x="96" y="118" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#38BDF8">RESEARCH PROTOTYPE</text>
  <text x="92" y="190" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#F8FAFC">dsh-superagent</text>
  <text x="96" y="236" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#A5B4CB">A proactive coding agent for one GitHub repository</text>

  <g stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round">
    <line x1="1062" y1="150" x2="1108" y2="70"/>
    <line x1="1062" y1="150" x2="1108" y2="150"/>
    <line x1="1062" y1="150" x2="1108" y2="230"/>
  </g>
  <rect x="938" y="88" width="124" height="124" rx="30" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="1000" cy="150" r="30" fill="url(#accent)" opacity="0.9"/>
  <circle cx="1000" cy="150" r="12" fill="#0B1220"/>

  <g fill="#0B1220" stroke="url(#accent)" stroke-width="2.5">
    <circle cx="1118" cy="64" r="9"/>
    <circle cx="1118" cy="150" r="9"/>
    <circle cx="1118" cy="236" r="9"/>
  </g>
</svg>
